name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          printf 'package main\n\nconst Version = "%s"\n' "${version}" > version.go
          mkdir -p stage dist

          wintun_version="0.14.1"
          wintun_archive="stage/wintun-${wintun_version}.zip"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --output "${wintun_archive}" \
            "https://www.wintun.net/builds/wintun-${wintun_version}.zip"
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  ${wintun_archive}" | sha256sum --check
          unzip -q "${wintun_archive}" -d stage/wintun-sdk

          build_target() {
            local target_id="$1"
            local target_os="$2"
            local target_arch="$3"
            local extension="$4"
            local archive_format="$5"
            local package="wireguard-go-${GITHUB_REF_NAME}-${target_id}"
            local package_dir="stage/${package}"

            mkdir -p "${package_dir}"
            env \
              CGO_ENABLED=0 \
              GOOS="${target_os}" \
              GOARCH="${target_arch}" \
              go build \
                -trimpath \
                -ldflags="-s -w -buildid=" \
                -o "${package_dir}/wireguard-go${extension}" \
                .

            cp LICENSE README.md "${package_dir}/"

            if [[ "${target_os}" == "windows" ]]; then
              cp \
                "stage/wintun-sdk/wintun/bin/${target_arch}/wintun.dll" \
                "${package_dir}/wintun.dll"
              cp \
                stage/wintun-sdk/wintun/LICENSE.txt \
                "${package_dir}/LICENSE.wintun.txt"
            fi

            if [[ "${archive_format}" == "zip" ]]; then
              (
                cd stage
                zip -q -r "../dist/${package}.zip" "${package}"
              )
            else
              tar -C stage -czf "dist/${package}.tar.gz" "${package}"
            fi
          }

          build_target macos-amd64 darwin amd64 "" tar.gz
          build_target macos-arm64 darwin arm64 "" tar.gz
          build_target windows-amd64 windows amd64 .exe zip
          build_target windows-arm64 windows arm64 .exe zip

          (
            cd dist
            sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          )

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
